[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-cadquery-server"
version = "0.1.0"
description = "A stdio MCP server for CadQuery operations"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "anthropic>=0.40.0",
    "cadquery==2.5.2",
    "mcp>=1.27.1",
    "pydantic",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[project.scripts]
mcp-cadquery = "mcp_cadquery_server.cli:main"

[tool.setuptools.packages.find]
include = ["mcp_cadquery_server*"]
exclude = ["models*", "workspace*", "tests*"]
